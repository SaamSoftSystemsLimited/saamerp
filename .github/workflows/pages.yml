name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      [
        "apps/web/**",
        "apps/backend/**",
        "scripts/verify_crm_demo.py",
        "scripts/check_published_demo.py",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: saamerp_demo
          POSTGRES_USER: saamerp_demo
          POSTGRES_PASSWORD: runner-demo-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saamerp_demo -d saamerp_demo"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CRM_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/saamerp_demo
      CRM_TEST_DATABASE_USER: saamerp_demo
      CRM_TEST_DATABASE_PASSWORD: runner-demo-only-password
      CRM_DATABASE_URL: jdbc:postgresql://localhost:5432/saamerp_demo
      CRM_DATABASE_USER: saamerp_demo
      CRM_DATABASE_PASSWORD: runner-demo-only-password
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: Test Java API against PostgreSQL
        working-directory: apps/backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Generate synthetic dataset through the API and verify restart
        working-directory: .
        run: python scripts/verify_crm_demo.py --jar apps/backend/target/saamerp-backend-0.1.0-SNAPSHOT.jar --output apps/web/public/demo/crm.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Select application workflow as Pages source
        id: pages-source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow > /dev/null
      - name: Report source configuration limitation
        if: steps.pages-source.outcome == 'failure'
        run: echo "::warning::Could not switch Pages source. Select GitHub Actions in repository Settings / Pages to prevent branch documentation builds."
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published application and synthetic CRM dataset
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/check_published_demo.py "$APP_URL"
